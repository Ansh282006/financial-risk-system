{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header" style="text-align: center; margin-bottom: 40px;">
        <h2><i class="fas fa-chart-line"></i> Future Investment Planning</h2>
        <p>Get personalized investment plans based on your goals and risk appetite</p>
    </div>

    <!-- Investment Planning Form -->
    <div class="section-card">
        <div class="section-card__header">
            <div class="header-icon"><i class="fas fa-chart-line"></i></div>
            <div>
                <h3>Investment Preferences</h3>
                <p>Tell us about your investment goals</p>
            </div>
        </div>
        
        <div style="padding: 20px;">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label><i class="fas fa-rupee-sign"></i> Investment Amount (₹)</label>
                    <input type="number" id="amount" class="form-control" placeholder="e.g., 100000" value="100000" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                </div>
                <div class="col-md-6 mb-3">
                    <label><i class="fas fa-clock"></i> Time Horizon (Years)</label>
                    <select id="time_horizon" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <option value="5">5-7 Years (Short-medium term)</option>
                        <option value="10" selected>10 Years (Medium term)</option>
                        <option value="15">15-20 Years (Long term)</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label><i class="fas fa-chart-line"></i> Risk Appetite</label>
                    <select id="risk_appetite" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <option value="Low">Low - Capital Protection</option>
                        <option value="Moderate" selected>Moderate - Balanced Growth</option>
                        <option value="High">High - Maximum Growth</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label><i class="fas fa-chart-simple"></i> Growth Expectation</label>
                    <select id="growth_expectation" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <option value="Slow">Slow & Steady (6-8% annual)</option>
                        <option value="Moderate" selected>Moderate (10-12% annual)</option>
                        <option value="Fast">Fast Growth (15%+ annual)</option>
                    </select>
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap;">
                <button id="generateBtn" class="btn-primary"><i class="fas fa-chart-line"></i> Generate Plan</button>
                <button id="resetInvestBtn" class="btn-secondary"><i class="fas fa-undo"></i> Reset</button>
                <button id="sampleInvestBtn" class="btn-sample"><i class="fas fa-chart-simple"></i> Sample Data</button>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div id="investmentResult" style="display: none;"></div>
</div>

<style>
    .form-control:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        padding: 12px 30px;
        border-radius: 30px;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(99, 102, 241, 0.3);
    }
    .btn-secondary {
        background: var(--bg-hover);
        border: 1px solid var(--border-color);
        padding: 12px 30px;
        border-radius: 30px;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
    }
    .btn-sample {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 12px 30px;
        border-radius: 30px;
        color: #10b981;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-sample:hover {
        background: rgba(16, 185, 129, 0.25);
    }
    
    .investment-plan-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 30px;
        margin: 30px 0;
        animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        flex-wrap: wrap;
        gap: 15px;
    }
    .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
    }
    .result-item {
        text-align: center;
        padding: 20px;
        background: var(--bg-hover);
        border-radius: 16px;
    }
    .result-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    .result-value {
        font-size: 1.3rem;
        font-weight: 700;
    }
    .result-value.large {
        font-size: 1.8rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    
    .allocation-section, .projections-section, .explanation-section, .recommendations {
        margin: 20px 0;
        padding: 20px;
        background: var(--bg-hover);
        border-radius: 16px;
    }
    .allocation-item {
        margin: 15px 0;
    }
    .allocation-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
    }
    .allocation-bar {
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
    }
    .allocation-fill {
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        border-radius: 4px;
        transition: width 0.5s ease;
    }
    .projection-item {
        padding: 12px;
        border-bottom: 1px solid var(--border-light);
    }
    .projection-item:last-child { border-bottom: none; }
    .projection-details {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 5px;
    }
    .plan-badge {
        display: inline-block;
        padding: 5px 15px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        color: white;
    }
    
    .recommendations ul {
        list-style: none;
        padding: 0;
        margin: 15px 0 0;
    }
    .recommendations li {
        padding: 8px 0;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
    }
    .recommendations li i {
        margin-right: 12px;
        color: #10b981;
    }
    
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(99,102,241,0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 30px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .alert {
        padding: 15px 20px;
        border-radius: 12px;
        margin: 20px 0;
    }
    .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
    }
</style>

<script>
    document.getElementById('generateBtn').addEventListener('click', async function() {
        const data = {
            amount: parseFloat(document.getElementById('amount').value) || 0,
            time_horizon: parseInt(document.getElementById('time_horizon').value) || 10,
            risk_appetite: document.getElementById('risk_appetite').value,
            growth_expectation: document.getElementById('growth_expectation').value
        };
        
        const resultDiv = document.getElementById('investmentResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div class="loading-spinner"></div><p style="text-align: center; margin-top: 20px;">Creating your personalized investment plan...</p>';
        
        try {
            const response = await fetch('/api/plan-investment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            if (result.success) {
                displayInvestmentPlan(result.plan);
                showToast('Investment plan generated!', 'success');
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                showToast(result.error, 'error');
            }
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            showToast(error.message, 'error');
        }
    });
    
    document.getElementById('resetInvestBtn').addEventListener('click', function() {
        document.getElementById('amount').value = '100000';
        document.getElementById('time_horizon').value = '10';
        document.getElementById('risk_appetite').value = 'Moderate';
        document.getElementById('growth_expectation').value = 'Moderate';
        document.getElementById('investmentResult').style.display = 'none';
        showToast('Form reset', 'info');
    });
    
    document.getElementById('sampleInvestBtn').addEventListener('click', function() {
        document.getElementById('amount').value = '500000';
        document.getElementById('time_horizon').value = '10';
        document.getElementById('risk_appetite').value = 'Moderate';
        document.getElementById('growth_expectation').value = 'Moderate';
        showToast('Sample data loaded! Click "Generate Plan"', 'success');
    });
    
    function displayInvestmentPlan(plan) {
        const resultDiv = document.getElementById('investmentResult');
        
        let allocationHtml = '';
        for (const [sector, pct] of Object.entries(plan.allocation)) {
            allocationHtml += `
                <div class="allocation-item">
                    <div class="allocation-info">
                        <span><strong>${sector}</strong></span>
                        <span>${pct}%</span>
                    </div>
                    <div class="allocation-bar">
                        <div class="allocation-fill" style="width: ${pct}%;"></div>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">
                        Expected annual return: ${plan.sector_returns[sector]?.toFixed(1) || 10}%
                    </div>
                </div>
            `;
        }
        
        let projectionsHtml = '';
        for (const [sector, data] of Object.entries(plan.projected_returns)) {
            projectionsHtml += `
                <div class="projection-item">
                    <strong>${sector}</strong> (${data.allocation}% allocation)
                    <div class="projection-details">
                        Annual return: ${data.annual_return}% | 
                        Projected value: ₹${data.projected_value.toLocaleString()} | 
                        Gain: +₹${data.total_gain.toLocaleString()}
                    </div>
                </div>
            `;
        }
        
        const html = `
            <div class="investment-plan-card">
                <div class="result-header">
                    <h3><i class="fas fa-chart-line"></i> Your Personalized Investment Plan</h3>
                    <span class="plan-badge">${plan.plan_type}</span>
                </div>
                
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Investment Amount</div>
                        <div class="result-value">${plan.formatted_amount}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Time Horizon</div>
                        <div class="result-value">${plan.time_horizon} years</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Risk Appetite</div>
                        <div class="result-value">${plan.risk_appetite}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Projected Final Value</div>
                        <div class="result-value large">${plan.formatted_final_value}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Total Returns</div>
                        <div class="result-value">${plan.formatted_return}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Return Multiple</div>
                        <div class="result-value">${(plan.total_projected_value / plan.investment_amount).toFixed(1)}x</div>
                    </div>
                </div>
                
                <div class="allocation-section">
                    <h4><i class="fas fa-chart-pie"></i> Recommended Allocation</h4>
                    ${allocationHtml}
                </div>
                
                <div class="projections-section">
                    <h4><i class="fas fa-chart-line"></i> Sector-wise Projections</h4>
                    ${projectionsHtml}
                </div>
                
                <div class="explanation-section">
                    <h4><i class="fas fa-info-circle"></i> Why This Plan?</h4>
                    <p>${plan.explanation.replace(/\n/g, '<br>')}</p>
                </div>
                
                <div class="recommendations">
                    <h4><i class="fas fa-lightbulb"></i> Recommendations</h4>
                    <ul>
                        ${plan.recommendations.map(rec => `<li><i class="fas fa-check-circle"></i> ${rec}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
        
        resultDiv.innerHTML = html;
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Animate bars
        setTimeout(() => {
            document.querySelectorAll('.allocation-fill').forEach(bar => {
                const width = bar.style.width;
                bar.style.width = '0';
                setTimeout(() => { bar.style.width = width; }, 100);
            });
        }, 100);
    }
    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast-notification toast-${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>
{% endblock %}
