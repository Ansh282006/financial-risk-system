<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinRisk Sentinel - Financial Risk Early Warning System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        /* Theme variables */
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1422;
            --bg-card: rgba(18, 22, 35, 0.85);
            --bg-card-solid: #121623;
            --bg-hover: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-light: rgba(255, 255, 255, 0.05);
            --gradient-primary: linear-gradient(135deg, #6366f1, #8b5cf6);
            --accent-info: #3b82f6;
        }
        
        body.light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-solid: #ffffff;
            --bg-hover: rgba(0, 0, 0, 0.03);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.04);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }
        
        /* Navigation */
        .navbar {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        body.light-theme .navbar {
            background: rgba(255, 255, 255, 0.9);
        }
        
        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        
        .nav-link {
            color: var(--text-muted);
            margin: 0 0.5rem;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
        }
        
        /* Theme Toggle */
        .theme-toggle {
            width: 42px;
            height: 42px;
            background: var(--bg-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border-light);
        }
        
        .theme-toggle:hover {
            background: var(--gradient-primary);
            transform: rotate(15deg);
        }
        
        .theme-toggle i {
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .theme-toggle:hover i {
            color: white;
        }
        
        /* Section Cards */
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .section-card__header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-icon i {
            color: white;
            font-size: 1.2rem;
        }
        
        /* Footer */
        .footer {
            background: var(--bg-card-solid);
            border-top: 1px solid var(--border-color);
            padding: 30px 0;
            margin-top: 50px;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .contact-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 18px;
            background: var(--bg-hover);
            border-radius: 40px;
        }
        
        .contact-info a {
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .footer-links a {
            width: 36px;
            height: 36px;
            background: var(--bg-hover);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin: 0 5px;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .footer-links a:hover {
            background: var(--gradient-primary);
            color: white;
        }
        
        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .footer-content { flex-direction: column; text-align: center; }
            .contact-info { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i>
                <span>FinRisk Sentinel</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/upload">Upload & Charts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/loan-prediction">Loan</a></li>
                    <li class="nav-item"><a class="nav-link" href="/risk-analysis">Risk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/investment-planning">Investment</a></li>
                </ul>
                <!-- Theme Toggle Button -->
                <div class="theme-toggle ms-3">

            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <i class="fas fa-chart-line"></i>
                    <span>FinRisk Sentinel</span>
                </div>
                <div class="contact-info">
                    <i class="fab fa-linkedin"></i>
                    <a href="https://linkedin.com/in/ansh-bhujbal-a36b37322" target="_blank">Ansh Bhujbal</a>
                    <span>|</span>
                    <i class="fas fa-phone"></i>
                    <span>9420661642</span>
                </div>
                <div class="footer-links">
                    <a href="https://linkedin.com/in/ansh-bhujbal-a36b37322" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2024 FinRisk Sentinel | ML-Powered Financial Intelligence</p>
                <p class="version">Powered by 7 Financial Datasets | Real-time Predictions</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Theme Toggle Functionality
        function initThemeToggle() {
            const toggle = document.querySelector('.theme-toggle');
            if (!toggle) return;
            
            // Check for saved theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                toggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('light-theme');
                toggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
            
            // Toggle on click
            toggle.addEventListener('click', function() {
                const isLight = document.body.classList.toggle('light-theme');
                
                if (isLight) {
                    this.innerHTML = '<i class="fas fa-sun"></i>';
                    localStorage.setItem('theme', 'light');
                } else {
                    this.innerHTML = '<i class="fas fa-moon"></i>';
                    localStorage.setItem('theme', 'dark');
                }
            });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initThemeToggle();
        });
    </script>
</body>
</html>
