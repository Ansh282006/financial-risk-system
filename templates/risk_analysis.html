{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header" style="text-align: center; margin-bottom: 40px;">
        <h2><i class="fas fa-chart-pie"></i> Investment Risk Analysis</h2>
        <p>Analyze your current investment portfolio for risk assessment and profit projections</p>
    </div>

    <!-- Risk Analysis Form -->
    <div class="section-card">
        <div class="section-card__header">
            <div class="header-icon">
                <i class="fas fa-chart-pie"></i>
            </div>
            <div>
                <h3>Portfolio Information</h3>
                <p class="text-muted">Enter your investment portfolio details for risk analysis</p>
            </div>
        </div>
        
        <div style="padding: 20px;">
            <div class="form-group">
                <label><i class="fas fa-rupee-sign"></i> Total Investment Amount (₹)</label>
                <input type="number" id="investment_amount" class="form-control" placeholder="e.g., 500000" value="500000" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
            </div>
            
            <div class="row" style="margin: 20px 0;">
                <div class="col-md-6">
                    <div class="form-group">
                        <label><i class="fas fa-chart-line"></i> Risk Tolerance</label>
                        <select id="risk_tolerance" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="Conservative">🛡️ Conservative (Low Risk)</option>
                            <option value="Moderate" selected>⚖️ Moderate (Balanced)</option>
                            <option value="Aggressive">🚀 Aggressive (High Risk)</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> Investment Horizon (Years)</label>
                        <select id="horizon" class="form-control" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="3">📅 Short-term (3 years)</option>
                            <option value="5" selected>📅 Medium-term (5 years)</option>
                            <option value="10">📅 Long-term (10 years)</option>
                            <option value="15">📅 Very Long-term (15+ years)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-chart-pie"></i> Portfolio Allocation</label>
                <div id="portfolioInputs" style="margin-top: 10px;">
                    <div class="portfolio-row" id="portfolio_row_0" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                        <select id="asset_type_0" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="Stocks">📈 Stocks / Equity</option>
                            <option value="Mutual Funds">📊 Mutual Funds</option>
                            <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                            <option value="Gold">🥇 Gold</option>
                            <option value="Real Estate">🏠 Real Estate</option>
                            <option value="Cash">💵 Cash / Savings</option>
                        </select>
                        <input type="number" id="asset_pct_0" placeholder="%" value="40" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <button type="button" class="btn-remove" onclick="removeAsset(0)" style="display: none; width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
                    </div>
                    <div class="portfolio-row" id="portfolio_row_1" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                        <select id="asset_type_1" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="Stocks">📈 Stocks / Equity</option>
                            <option value="Mutual Funds" selected>📊 Mutual Funds</option>
                            <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                            <option value="Gold">🥇 Gold</option>
                            <option value="Real Estate">🏠 Real Estate</option>
                            <option value="Cash">💵 Cash / Savings</option>
                        </select>
                        <input type="number" id="asset_pct_1" placeholder="%" value="30" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <button type="button" class="btn-remove" onclick="removeAsset(1)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
                    </div>
                    <div class="portfolio-row" id="portfolio_row_2" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                        <select id="asset_type_2" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="Stocks">📈 Stocks / Equity</option>
                            <option value="Mutual Funds">📊 Mutual Funds</option>
                            <option value="Fixed Deposits" selected>🏦 Fixed Deposits</option>
                            <option value="Gold">🥇 Gold</option>
                            <option value="Real Estate">🏠 Real Estate</option>
                            <option value="Cash">💵 Cash / Savings</option>
                        </select>
                        <input type="number" id="asset_pct_2" placeholder="%" value="20" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <button type="button" class="btn-remove" onclick="removeAsset(2)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
                    </div>
                    <div class="portfolio-row" id="portfolio_row_3" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                        <select id="asset_type_3" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <option value="Stocks">📈 Stocks / Equity</option>
                            <option value="Mutual Funds">📊 Mutual Funds</option>
                            <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                            <option value="Gold" selected>🥇 Gold</option>
                            <option value="Real Estate">🏠 Real Estate</option>
                            <option value="Cash">💵 Cash / Savings</option>
                        </select>
                        <input type="number" id="asset_pct_3" placeholder="%" value="10" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <button type="button" class="btn-remove" onclick="removeAsset(3)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
                    </div>
                </div>
                <button type="button" class="btn-add" onclick="addAsset()" style="margin-top: 10px; padding: 10px 20px; background: var(--bg-hover); border: 1px dashed var(--border-color); border-radius: 8px; color: var(--text-secondary); cursor: pointer;">
                    <i class="fas fa-plus"></i> Add Asset Class
                </button>
            </div>
            
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px; flex-wrap: wrap;">
                <button id="analyzeBtn" class="btn-primary" style="background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; padding: 12px 30px; border-radius: 30px; color: white; font-weight: 600; cursor: pointer;">
                    <i class="fas fa-chart-line"></i> Analyze Risk
                </button>
                <button id="resetBtn" class="btn-secondary" style="background: var(--bg-hover); border: 1px solid var(--border-color); padding: 12px 30px; border-radius: 30px; color: var(--text-primary); cursor: pointer;">
                    <i class="fas fa-undo"></i> Reset
                </button>
                <button id="sampleBtn" class="btn-sample" style="background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); padding: 12px 30px; border-radius: 30px; color: #10b981; cursor: pointer;">
                    <i class="fas fa-chart-simple"></i> Load Sample
                </button>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div id="riskResult" style="display: none;"></div>
</div>

<style>
    .risk-analysis-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 30px;
        margin: 30px 0;
        animation: fadeInUp 0.5s ease;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
        flex-wrap: wrap;
        gap: 15px;
    }
    
    .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
    }
    
    .result-item {
        text-align: center;
        padding: 20px;
        background: var(--bg-hover);
        border-radius: 16px;
        transition: transform 0.3s;
    }
    
    .result-item:hover {
        transform: translateY(-3px);
    }
    
    .result-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .result-value {
        font-size: 1.5rem;
        font-weight: 700;
    }
    
    .result-value.large {
        font-size: 2rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    
    .risk-badge {
        display: inline-block;
        padding: 6px 18px;
        border-radius: 30px;
        font-size: 0.85rem;
        font-weight: 600;
    }
    
    .risk-success {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }
    
    .risk-warning {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
    }
    
    .risk-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .analysis-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin: 20px 0;
    }
    
    .analysis-item {
        padding: 15px;
        background: var(--bg-hover);
        border-radius: 12px;
        text-align: center;
    }
    
    .analysis-item span {
        display: block;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 5px;
    }
    
    .analysis-item strong {
        font-size: 1.2rem;
    }
    
    .risk-factors, .recommendations {
        margin-top: 25px;
        padding: 20px;
        background: var(--bg-hover);
        border-radius: 16px;
    }
    
    .risk-factors ul, .recommendations ul {
        list-style: none;
        padding: 0;
        margin: 15px 0 0;
    }
    
    .risk-factors li, .recommendations li {
        padding: 10px 0;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
    }
    
    .risk-factors li:last-child, .recommendations li:last-child {
        border-bottom: none;
    }
    
    .risk-factors li i, .recommendations li i {
        margin-right: 12px;
        font-size: 0.8rem;
    }
    
    .portfolio-analysis {
        margin: 20px 0;
        padding: 20px;
        background: var(--bg-hover);
        border-radius: 16px;
    }
    
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 30px auto;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .alert {
        padding: 15px 20px;
        border-radius: 12px;
        margin: 20px 0;
    }
    
    .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
</style>

<script>
    let assetCount = 4;
    
    function addAsset() {
        const container = document.getElementById('portfolioInputs');
        const newRow = document.createElement('div');
        newRow.className = 'portfolio-row';
        newRow.id = `portfolio_row_${assetCount}`;
        newRow.style.display = 'flex';
        newRow.style.gap = '10px';
        newRow.style.marginBottom = '10px';
        newRow.style.alignItems = 'center';
        newRow.innerHTML = `
            <select id="asset_type_${assetCount}" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                <option value="Stocks">📈 Stocks / Equity</option>
                <option value="Mutual Funds">📊 Mutual Funds</option>
                <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                <option value="Gold">🥇 Gold</option>
                <option value="Real Estate">🏠 Real Estate</option>
                <option value="Cash">💵 Cash / Savings</option>
            </select>
            <input type="number" id="asset_pct_${assetCount}" placeholder="%" value="0" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
            <button type="button" class="btn-remove" onclick="removeAsset(${assetCount})" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
        `;
        container.appendChild(newRow);
        assetCount++;
    }
    
    function removeAsset(id) {
        const row = document.getElementById(`portfolio_row_${id}`);
        if (row) row.remove();
    }
    
    function getPortfolioData() {
        const portfolio = [];
        for (let i = 0; i < assetCount; i++) {
            const typeEl = document.getElementById(`asset_type_${i}`);
            const pctEl = document.getElementById(`asset_pct_${i}`);
            if (typeEl && pctEl && parseFloat(pctEl.value) > 0) {
                portfolio.push({
                    type: typeEl.value,
                    percentage: parseFloat(pctEl.value)
                });
            }
        }
        return portfolio;
    }
    
    // Button event listeners
    document.getElementById('analyzeBtn').addEventListener('click', async function() {
        const data = {
            investment_amount: parseFloat(document.getElementById('investment_amount').value) || 0,
            portfolio: getPortfolioData(),
            risk_tolerance: document.getElementById('risk_tolerance').value,
            horizon: parseInt(document.getElementById('horizon').value) || 5
        };
        
        const resultDiv = document.getElementById('riskResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div class="loading-spinner"></div><p style="text-align: center; margin-top: 20px;">Analyzing your portfolio...</p>';
        
        try {
            const response = await fetch('/api/analyze-risk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.success) {
                displayRiskAnalysis(result.analysis);
                showToast('Risk analysis completed!', 'success');
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
                showToast(result.error, 'error');
            }
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            showToast(error.message, 'error');
        }
    });
    
    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('investment_amount').value = '500000';
        document.getElementById('risk_tolerance').value = 'Moderate';
        document.getElementById('horizon').value = '5';
        
        // Reset portfolio inputs
        const container = document.getElementById('portfolioInputs');
        container.innerHTML = `
            <div class="portfolio-row" id="portfolio_row_0" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="asset_type_0" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                    <option value="Stocks">📈 Stocks / Equity</option>
                    <option value="Mutual Funds">📊 Mutual Funds</option>
                    <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                    <option value="Gold">🥇 Gold</option>
                    <option value="Real Estate">🏠 Real Estate</option>
                    <option value="Cash">💵 Cash / Savings</option>
                </select>
                <input type="number" id="asset_pct_0" placeholder="%" value="40" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                <button type="button" class="btn-remove" onclick="removeAsset(0)" style="display: none;">✗</button>
            </div>
            <div class="portfolio-row" id="portfolio_row_1" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="asset_type_1" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                    <option value="Stocks">📈 Stocks / Equity</option>
                    <option value="Mutual Funds" selected>📊 Mutual Funds</option>
                    <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                    <option value="Gold">🥇 Gold</option>
                    <option value="Real Estate">🏠 Real Estate</option>
                    <option value="Cash">💵 Cash / Savings</option>
                </select>
                <input type="number" id="asset_pct_1" placeholder="%" value="30" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                <button type="button" class="btn-remove" onclick="removeAsset(1)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
            </div>
            <div class="portfolio-row" id="portfolio_row_2" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="asset_type_2" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                    <option value="Stocks">📈 Stocks / Equity</option>
                    <option value="Mutual Funds">📊 Mutual Funds</option>
                    <option value="Fixed Deposits" selected>🏦 Fixed Deposits</option>
                    <option value="Gold">🥇 Gold</option>
                    <option value="Real Estate">🏠 Real Estate</option>
                    <option value="Cash">💵 Cash / Savings</option>
                </select>
                <input type="number" id="asset_pct_2" placeholder="%" value="20" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                <button type="button" class="btn-remove" onclick="removeAsset(2)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
            </div>
            <div class="portfolio-row" id="portfolio_row_3" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                <select id="asset_type_3" style="flex: 2; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                    <option value="Stocks">📈 Stocks / Equity</option>
                    <option value="Mutual Funds">📊 Mutual Funds</option>
                    <option value="Fixed Deposits">🏦 Fixed Deposits</option>
                    <option value="Gold" selected>🥇 Gold</option>
                    <option value="Real Estate">🏠 Real Estate</option>
                    <option value="Cash">💵 Cash / Savings</option>
                </select>
                <input type="number" id="asset_pct_3" placeholder="%" value="10" style="width: 100px; padding: 10px; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);">
                <button type="button" class="btn-remove" onclick="removeAsset(3)" style="width: 34px; height: 34px; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); border-radius: 50%; color: #ef4444; cursor: pointer;">✗</button>
            </div>
        `;
        assetCount = 4;
        
        const resultDiv = document.getElementById('riskResult');
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        
        showToast('Form has been reset', 'info');
    });
    
    document.getElementById('sampleBtn').addEventListener('click', function() {
        document.getElementById('investment_amount').value = '500000';
        document.getElementById('risk_tolerance').value = 'Moderate';
        document.getElementById('horizon').value = '5';
        
        // Reset to sample portfolio
        document.getElementById('asset_type_0').value = 'Stocks';
        document.getElementById('asset_pct_0').value = '40';
        document.getElementById('asset_type_1').value = 'Mutual Funds';
        document.getElementById('asset_pct_1').value = '30';
        document.getElementById('asset_type_2').value = 'Fixed Deposits';
        document.getElementById('asset_pct_2').value = '20';
        document.getElementById('asset_type_3').value = 'Gold';
        document.getElementById('asset_pct_3').value = '10';
        
        showToast('Sample portfolio loaded! Click "Analyze Risk"', 'success');
    });
    
    function displayRiskAnalysis(analysis) {
        const resultDiv = document.getElementById('riskResult');
        
        const riskClass = analysis.risk_color === 'success' ? 'risk-success' : (analysis.risk_color === 'warning' ? 'risk-warning' : 'risk-danger');
        
        const html = `
            <div class="risk-analysis-card">
                <div class="result-header">
                    <h3><i class="fas fa-chart-pie"></i> Risk Analysis Report</h3>
                    <span class="risk-badge ${riskClass}">${analysis.risk_category}</span>
                </div>
                
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Risk Score</div>
                        <div class="result-value">${analysis.risk_score}/100</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Expected Annual Return</div>
                        <div class="result-value">${analysis.expected_return}%</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Expected Profit</div>
                        <div class="result-value large">${analysis.formatted_profit}</div>
                    </div>
                </div>
                
                <div class="portfolio-analysis">
                    <h4><i class="fas fa-chart-simple"></i> Portfolio Analysis</h4>
                    <div class="analysis-grid">
                        <div class="analysis-item">
                            <span>Diversification Score</span>
                            <strong>${analysis.portfolio_analysis.diversification_score}%</strong>
                        </div>
                        <div class="analysis-item">
                            <span>Stock Exposure</span>
                            <strong>${analysis.portfolio_analysis.stock_exposure}%</strong>
                        </div>
                        <div class="analysis-item">
                            <span>Safe Assets</span>
                            <strong>${analysis.portfolio_analysis.safe_assets}%</strong>
                        </div>
                    </div>
                </div>
                
                <div class="risk-factors">
                    <h4><i class="fas fa-exclamation-triangle"></i> Risk Factors</h4>
                    <ul>
                        ${analysis.risk_factors.map(f => `<li><i class="fas fa-circle" style="font-size: 0.5rem; color: #f59e0b;"></i> ${f}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="recommendations">
                    <h4><i class="fas fa-lightbulb"></i> Recommendations</h4>
                    <ul>
                        ${analysis.recommendations.map(rec => `<li><i class="fas fa-check-circle" style="color: #10b981;"></i> ${rec}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `;
        
        resultDiv.innerHTML = html;
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast-notification toast-${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>
{% endblock %}
